# ================================================================
# RENDER.COM STATIC SITE CONFIGURATION
# ================================================================
# This file configures Render.com deployment settings for the React SPA.
#
# The key configuration is the rewrite rule that sends ALL requests
# to index.html, enabling React Router client-side routing to work
# correctly on page refresh and deep links.
# ================================================================

services:
  - type: web
    name: hybits-crm
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    # PR previews would run untrusted branch code against the PRODUCTION
    # Supabase project (they inherit the VITE_* values). Keep them off
    # unless previews get their own staging project.
    pullRequestPreviewsEnabled: false

    # ================================================================
    # BUILD-TIME ENVIRONMENT (REQUIRED)
    # ================================================================
    # Vite inlines VITE_* variables at BUILD time, not at runtime.
    # If these are missing when Render runs `npm run build`, they
    # compile to undefined and src/lib/supabase.ts throws on module
    # load -- before React mounts. The result is a blank white page
    # with no error UI and no way to log in.
    #
    # `sync: false` means Render will NOT read these from this file;
    # you must set the values in the Render dashboard
    # (Environment -> Environment Variables) for the service, and for
    # PR previews if you use them. The local .env is gitignored and
    # never reaches the build.
    #
    # After changing either value you must trigger a REBUILD, not
    # just a redeploy -- the values are baked into the bundle.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # CRITICAL: This rewrite rule fixes 404 on page refresh
      # 
      # Without this rule:
      #   User visits /events → 404 Not Found (no events file exists)
      #
      # With this rule:
      #   User visits /events → Rewrite to /index.html → React Router handles /events
      #
      # Action: "rewrite" (NOT "redirect")
      # - Rewrite: URL stays as /events, but serves index.html content
      # - Redirect: URL would change to /index.html (wrong for SPA)
      - type: rewrite
        source: /*
        destination: /index.html

    # ================================================================
    # SECURITY HEADERS
    # ================================================================
    # The Supabase session lives in localStorage, so XSS = account takeover.
    # CSP allows only this site, Google Fonts and Supabase; no framing.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
