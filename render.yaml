# ================================================================
# RENDER.COM STATIC SITE CONFIGURATION
# ================================================================
# This file configures Render.com deployment settings for the React SPA.
#
# The key configuration is the rewrite rule that sends ALL requests
# to index.html, enabling React Router client-side routing to work
# correctly on page refresh and deep links.
# ================================================================

services:
  - type: web
    name: hybits-crm
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    pullRequestPreviewsEnabled: true

    # ================================================================
    # BUILD-TIME ENVIRONMENT (REQUIRED)
    # ================================================================
    # Vite inlines VITE_* variables at BUILD time, not at runtime.
    # If these are missing when Render runs `npm run build`, they
    # compile to undefined and src/lib/supabase.ts throws on module
    # load -- before React mounts. The result is a blank white page
    # with no error UI and no way to log in.
    #
    # `sync: false` means Render will NOT read these from this file;
    # you must set the values in the Render dashboard
    # (Environment -> Environment Variables) for the service, and for
    # PR previews if you use them. The local .env is gitignored and
    # never reaches the build.
    #
    # After changing either value you must trigger a REBUILD, not
    # just a redeploy -- the values are baked into the bundle.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # CRITICAL: This rewrite rule fixes 404 on page refresh
      # 
      # Without this rule:
      #   User visits /events → 404 Not Found (no events file exists)
      #
      # With this rule:
      #   User visits /events → Rewrite to /index.html → React Router handles /events
      #
      # Action: "rewrite" (NOT "redirect")
      # - Rewrite: URL stays as /events, but serves index.html content
      # - Redirect: URL would change to /index.html (wrong for SPA)
      - type: rewrite
        source: /*
        destination: /index.html
